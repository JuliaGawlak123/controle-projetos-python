name: CI - Python

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar versão do Python
        run: python --version

      - name: Verificar sintaxe do projeto
        run: python -m py_compile main.py